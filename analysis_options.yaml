# Análisis estático de Numo. Lo ejecuta `flutter analyze` (y la CI con
# --fatal-infos, así que cualquier aviso hace fallar el build).
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    # Código generado (Isar, gen-l10n).
    - lib/**/*.g.dart
    - lib/l10n/app_localizations*.dart
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # Futuros sin await: casi siempre son errores en una app con Isar.
    unawaited_futures: warning
    missing_return: error

linter:
  rules:
    # Estilo
    - prefer_single_quotes
    - directives_ordering
    - sort_child_properties_last
    - use_super_parameters
    - prefer_final_locals
    - prefer_final_in_for_each
    - unnecessary_lambdas
    - unnecessary_parenthesis
    - unnecessary_statements
    - avoid_redundant_argument_values
    - always_declare_return_types
    - type_annotate_public_apis
    - omit_local_variable_types
    # Errores comunes
    - unawaited_futures
    - cancel_subscriptions
    - close_sinks
    - avoid_dynamic_calls
    - avoid_void_async
    - no_adjacent_strings_in_list
    - literal_only_boolean_expressions
    - test_types_in_equals
    - throw_in_finally
    - use_build_context_synchronously
