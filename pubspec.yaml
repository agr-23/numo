name: numo
description: "Numo: finanzas personales simples, privadas y sin conexión."
publish_to: 'none'

# versión+build. La versión debe coincidir con kAppVersion
# (lib/core/constants/app_info.dart); el build sube en cada publicación.
version: 1.1.0+2

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Base de datos local
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1

  # Estado
  flutter_riverpod: ^2.5.1

  # Navegación
  go_router: ^12.1.3

  # Gráficos
  fl_chart: ^0.68.0

  # Biometría y PIN
  local_auth: ^2.2.0
  crypto: ^3.0.8

  # Formato internacional (moneda, fechas)
  intl: ^0.20.3

  # Confeti para metas completadas
  confetti: ^0.8.0

  # Exportar CSV
  csv: ^6.0.0
  path_provider: ^2.1.6
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  isar_generator: ^3.1.0+1
  build_runner: ^2.4.9
  flutter_lints: ^4.0.0

flutter:
  generate: true
  uses-material-design: true

  # Inter (OFL 1.1, github.com/rsms/inter v4.1), incluida en la app para
  # que se vea igual sin conexión.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
