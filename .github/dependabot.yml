# Actualizaciones automáticas de dependencias.
# - Las menores y de parche llegan juntas en un solo PR al mes.
# - Las mayores (pueden romper cosas) llegan cada una en su propio PR.
version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: build
      include: scope
    open-pull-requests-limit: 5
    groups:
      menores:
        update-types: [minor, patch]
    ignore:
      # Migración grande, planificada aparte (ver issue de Riverpod 3).
      - dependency-name: flutter_riverpod
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      menores:
        update-types: [minor, patch]
