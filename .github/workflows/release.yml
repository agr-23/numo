name: Release

# Al publicar una etiqueta vX.Y.Z compila el APK y crea la versión en
# GitHub con el archivo adjunto. Ver docs/RELEASING.md.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Verificar que la etiqueta coincide con pubspec.yaml
        run: |
          version=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([0-9.]+).*/\1/')
          [ "v$version" = "${GITHUB_REF_NAME}" ] || {
            echo "La etiqueta ${GITHUB_REF_NAME} no coincide con pubspec ($version)"; exit 1; }
      - run: flutter test
      - name: Preparar keystore (si está configurado)
        env:
          KEYSTORE_BASE64: ${{ secrets.NUMO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/numo.jks"
            echo "NUMO_KEYSTORE_PATH=$RUNNER_TEMP/numo.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Sin keystore: el APK se firma con la clave de depuración."
          fi
      - name: Compilar APK firmado
        env:
          NUMO_KEYSTORE_PASSWORD: ${{ secrets.NUMO_KEYSTORE_PASSWORD }}
          NUMO_KEY_ALIAS: ${{ secrets.NUMO_KEY_ALIAS }}
          NUMO_KEY_PASSWORD: ${{ secrets.NUMO_KEY_PASSWORD }}
        run: |
          flutter build apk --release --split-per-abi --target-platform android-arm64
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "numo-${GITHUB_REF_NAME}.apk"
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: numo-${{ github.ref_name }}.apk
          generate_release_notes: true
