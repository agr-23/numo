name: Reportar un error
description: Algo no funciona como debería
labels: [bug]
body:
  - type: textarea
    id: que
    attributes:
      label: Qué pasó
      description: Qué esperabas y qué ocurrió en cambio.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Ir a Ahorros
        2. Tocar "Aportar"
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión de Numo
      description: Está en Ajustes → Acerca de.
  - type: input
    id: telefono
    attributes:
      label: Teléfono y versión de Android
